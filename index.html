<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width,initial-scale=1" />

  <title>JumperGames</title>

  <link rel="stylesheet"
        href="./css/style.css" />
</head>

<body>

  <!-- FUNDO -->

  <div class="bg-wrap" aria-hidden="true">

    <img
      src="./fundojumper.png"
      alt=""
      class="bg-img" />

  </div>


  <!-- CONTEÚDO -->

  <div class="content">


    <!-- LETREIRO -->

    <header class="marquee-wrap">

      <div
        class="marquee"
        id="marquee">

        <span
          class="marquee-text"
          id="marqueeText">

          JumperGames

        </span>

      </div>

    </header>


    <!-- MENU -->

    <div
      class="games"
      role="navigation"
      aria-label="Menu de jogos">


      <!-- JOKENPÔ -->

      <div
        class="card"
        onclick="abrirJogo('jokenpo')"
        tabindex="0">

        <div class="icon">✂️</div>

        <span>Jokenpô</span>

      </div>


      <!-- DADOS -->

      <div
        class="card"
        onclick="abrirJogo('dados')"
        tabindex="0">

        <div class="icon">🎲</div>

        <span>Dados</span>

      </div>


      <!-- MOEDA -->

      <div
        class="card"
        onclick="abrirJogo('moeda')"
        tabindex="0">

        <div class="icon">🪙</div>

        <span>Moeda</span>

      </div>

    </div>


    <!-- ÁREA DOS JOGOS -->

    <div id="areaJogo"></div>

  </div>


  <!-- GAME OVER -->

  <div id="gameOverTela">

    <img
      src="./gameover.png"
      alt="Game Over">

  </div>

  <div id="victoryTela">
  <img src="./victory.png" alt="Victory">
</div>

  <!-- SCRIPT -->

  <script src="./js/script.js"></script>


  <!-- ENTER E ESPAÇO -->

  <script>

    (function () {

      const cards =
        document.querySelectorAll('.card');

      cards.forEach(card => {

        card.addEventListener('keydown', (e) => {

          if (
            e.key === 'Enter' ||
            e.key === ' '
          ) {

            e.preventDefault();

            card.click();

          }

        });

      });

    })();

  </script>

</body>
</html>
