<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JumperGames 2.0</title>

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

  <!-- FUNDO -->

  <div class="bg-wrap">

    <img
      src="./fundojumper.png"
      class="bg-img">

  </div>

  <div class="grid-bg"></div>

  <!-- PARTICULAS -->

  <div class="particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  </div>

  <div class="content">

    <h1 class="titulo">
      JUMPERGAMES 2.0
    </h1>

    <div class="top-title">

      SELECT YOUR GAME

    </div>

    <!-- MENU -->

    <div class="games">

      <div class="game-card" onclick="abrirJogo('jokenpo')">
        <div class="game-title-box">✊ JOKENPÔ</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('dados')">
        <div class="game-title-box">🎲 DADOS</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('moeda')">
        <div class="game-title-box">🪙 MOEDA</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('interruptor')">
        <div class="game-title-box">💡 INTERRUPTOR</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('cofre')">
        <div class="game-title-box">🏦 COFRE</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('pomodoro')">
        <div class="game-title-box">🍅 POMODORO</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

      <div class="game-card" onclick="abrirJogo('teclado')">
        <div class="game-title-box">🎹 TECLADO</div>
        <button class="play-btn">PLAY GAME</button>
      </div>

    </div>

    <!-- AREA DOS JOGOS -->

    <div id="areaJogo"></div>

  </div>

  <!-- GAME OVER -->

  <div id="gameOverTela">

    <img src="./gameover.png">

  </div>

  <!-- VICTORY -->

  <div id="victoryTela">

    <img src="./victory.png">

  </div>

  <!-- SONS -->

  <audio id="somVitoria" src="./Somdavitoria.mp3"></audio>

  <audio id="somDerrota" src="./Somdaderrota.mp3"></audio>

  <!-- SCRIPT -->

  <script src="./js/script.js"></script>

</body>
</html>
